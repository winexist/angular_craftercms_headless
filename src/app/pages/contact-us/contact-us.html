<section class="contact" aria-labelledby="contact-title">
  <h1 id="contact-title">Contact us</h1>
  <p class="intro">Tell us about your project and we will reply within two business days.</p>

  <div class="grid">
    <article>
      <h2>Email</h2>
      <p>hello@northstar-studio.example</p>
    </article>
    <article>
      <h2>Phone</h2>
      <p>+1 (555) 010-2400</p>
    </article>
    <article>
      <h2>Office</h2>
      <p>42 Market Street, Suite 500, San Francisco, CA</p>
    </article>
  </div>

  <form class="contact-form" aria-label="Contact form">
    <label>
      Name
      <input type="text" name="name" placeholder="Your name" />
    </label>
    <label>
      Email
      <input type="email" name="email" placeholder="you@company.com" />
    </label>
    <label>
      Message
      <textarea name="message" rows="5" placeholder="A short project summary"></textarea>
    </label>
    <button type="button">Send message</button>
  </form>
</section>
