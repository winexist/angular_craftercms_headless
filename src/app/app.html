<div class="site-shell">
  <header class="site-header" aria-label="Main header">
    <div class="container header-inner">
      <a class="brand" routerLink="/" aria-label="Northstar Studio home">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span>Northstar Studio</span>
      </a>

      <nav class="site-nav" aria-label="Primary navigation">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          >Home</a
        >
        <a routerLink="/home-details" routerLinkActive="active">Home details</a>
        <a routerLink="/about-us" routerLinkActive="active">About us</a>
        <a routerLink="/blogs" routerLinkActive="active">Blogs</a>
        <a routerLink="/contact-us" routerLinkActive="active">Contact us</a>
        <a routerLink="/site-details" routerLinkActive="active">Site details</a>
      </nav>
    </div>
  </header>

  <main class="site-main container" id="main-content">
    <router-outlet />
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Built with Angular SSR</p>
      <p>2026 Northstar Studio. All rights reserved.</p>
    </div>
  </footer>
</div>
